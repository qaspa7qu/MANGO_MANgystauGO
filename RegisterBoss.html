<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    
    <link rel="stylesheet" href="RegisterBoss.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@500&display=swap" />
    
    <style>
        /* Центрируем всё содержимое страницы */
        body {
            margin: 0;
            padding: 0;
            background-color: #fff; /* Делаем общий фон белым */
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Ограничиваем контейнер шириной макета и убираем смещение */
        .div {
            width: 1280px !important;
            margin: 0 auto;
            position: relative;
            background-color: #fff;
            overflow: hidden;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    
    <div class="div">
        <div class="rectangle-parent">
            <div class="group-child"></div>
            <img class="mango-textlogo-png-1-icon" src="logo.png" alt="Logo">
        </div>

        <div class="child"></div>

        <div class="group-parent">
            <div class="rectangle-wrapper">
                <div class="group-item"></div>
            </div>
            <div class="group-inner"></div>
            <div class="div2">Ищу сотрудника</div>
            <div class="wrapper">
                <div class="div3">Ищу работу</div>
            </div>
        </div>

        <div class="group-container">
            <div class="group-div">
                <div class="group-div">
                    <div class="rectangle-div"></div>
                </div>
                <div class="kz">KZ</div>
            </div>
            <div class="rectangle-group">
                <div class="group-child2"></div>
                <div class="ru">RU</div>
            </div>
        </div>

        <div class="div4">Регистрация для поиска сотрудников</div>

        <div class="inner">
            <div class="group-child3"></div>
        </div>

        <div class="rectangle-parent2">
            <div class="group-child4"></div>
            <div class="div5">Электронная почта</div>
            <div class="div6">Пароль</div>
        </div>

        <div class="rectangle-parent3">
            <div class="group-child5"></div>
            <div class="div7">Дальше</div>
        </div>
    </div>
    
</body>
</html>
